version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tuneforge
      POSTGRES_PASSWORD: tuneforge
      POSTGRES_DB: tuneforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://tuneforge:tuneforge@db:5432/tuneforge
    env_file:
      - ./backend/.env
    depends_on:
      - db

volumes:
  pgdata:
